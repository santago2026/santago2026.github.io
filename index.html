<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festa di Sant'Agostino 2026 · Grazie!</title>
<meta name="description" content="Il menu della Festa di Sant'Agostino 2026: piadine, pinzini fritti, dolci e bevande.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#14452F;
    --verde-scuro:#0E3222;
    --panna:#FBF6EA;
    --rosso:#B5232B;
    --mais:#E8B33C;
    --inchiostro:#1A211D;
    --riga:rgba(20,69,47,.18);
    --display:"Archivo Black",system-ui,sans-serif;
    --testo:"Archivo",system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

  body{
    margin:0;
    background:var(--panna);
    color:var(--inchiostro);
    font-family:var(--testo);
    font-size:17px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
  }

  .wrap{max-width:940px;margin:0 auto;padding:0 20px}

  /* ---------- Testata ---------- */
  .testata{
    background:var(--verde);
    color:var(--panna);
    padding:38px 0 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .testata::after{
    content:"";
    position:absolute;left:0;right:0;bottom:0;height:6px;
    background:repeating-linear-gradient(90deg,var(--mais) 0 14px,var(--rosso) 14px 28px);
  }
  .occhiello{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mais);margin:0 0 12px;font-weight:600;
  }
  .titolo{
    font-family:var(--display);
    margin:0;
    line-height:1.02;
    text-transform:none;
    font-variant-caps:small-caps;
    letter-spacing:.005em;
    overflow-wrap:break-word;
  }
  .titolo span{display:block}
  .titolo .riga1{
    font-size:clamp(1.15rem,4.4vw,1.7rem);
    letter-spacing:.06em;
  }
  .titolo .riga2{
    font-size:clamp(1.85rem,8vw,3.2rem);
    color:var(--mais);
    line-height:1;
  }
  .titolo .anno{
    font-size:clamp(1rem,3.6vw,1.45rem);
    letter-spacing:.14em;
    margin-top:6px;
    color:rgba(251,246,234,.85);
  }
  .sottotitolo{
    margin:14px auto 0;max-width:34ch;
    font-size:15px;color:rgba(251,246,234,.8);
  }

  /* ---------- Navigazione sezioni ---------- */
  .banchi{
    position:sticky;top:0;z-index:10;
    background:var(--panna);
    border-bottom:1px solid var(--riga);
    padding:10px 0;
  }
  .banchi ul{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    list-style:none;margin:0;padding:0;
  }
  .banchi a{
    display:block;
    padding:8px 16px;
    border:1.5px solid var(--verde);
    border-radius:999px;
    color:var(--verde);
    text-decoration:none;
    font-size:13px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;
    transition:background .18s,color .18s;
  }
  .banchi a:hover,.banchi a:focus-visible{background:var(--verde);color:var(--panna)}
  a:focus-visible{outline:3px solid var(--rosso);outline-offset:3px}

  /* ---------- Sezioni ---------- */
  .sezione{margin:44px 0 0}
  .insegna{
    background:var(--verde);
    color:var(--panna);
    border-radius:4px;
    padding:16px 22px;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    position:relative;
  }
  /* firma: le lampadine appese sopra l'insegna del banco */
  .insegna::before{
    content:"";
    position:absolute;left:18px;right:18px;top:-9px;height:9px;
    background-image:radial-gradient(circle at center,var(--mais) 0 3.5px,transparent 4px);
    background-size:26px 9px;
    background-repeat:repeat-x;
    background-position:center bottom;
  }
  .insegna h2{
    font-family:var(--display);
    font-size:clamp(1.3rem,4vw,1.9rem);
    margin:0;text-transform:uppercase;letter-spacing:.02em;
  }
  .insegna p{margin:0;font-size:13px;color:var(--mais);letter-spacing:.06em;text-transform:uppercase}

  .voci{list-style:none;margin:0;padding:0}
  .voce{
    display:flex;align-items:baseline;gap:10px;
    padding:13px 4px;
    border-bottom:1px solid var(--riga);
  }
  .voce:last-child{border-bottom:0}
  .nome{font-weight:600}
  .nome em{
    display:block;font-style:italic;font-weight:400;
    font-size:14px;color:rgba(26,33,29,.62);margin-top:2px;
  }
  .punti{
    flex:1;
    border-bottom:1.5px dotted var(--riga);
    transform:translateY(-4px);
    min-width:18px;
  }
  .prezzo{
    font-family:var(--display);
    font-size:1.05rem;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  /* due formati sulla stessa riga: piccola / grande */
  .formati{display:flex;gap:20px;white-space:nowrap}
  .formato{text-align:right}
  .formato small{
    display:block;
    font-family:var(--testo);
    font-size:11px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;
    color:rgba(26,33,29,.55);
  }

  /* ---------- Chiusura ---------- */
  .chiusura{
    margin:52px 0 0;
    background:var(--verde);color:var(--panna);
    text-align:center;padding:30px 20px;
  }
  .chiusura p{margin:0 0 6px;font-size:14px;color:rgba(251,246,234,.82)}
  .chiusura strong{color:var(--mais)}

  /* ---------- Stampa: A4, due colonne, niente colore di fondo ---------- */


.qr{
  max-width:820px; margin:2.4rem auto .6rem; padding:0 1rem;
  display:flex; flex-direction:column; align-items:center; gap:.55rem; text-align:center;
}
.qr svg{
  width:104px; height:104px; display:block;
  background:#fff; padding:7px; border-radius:6px;
  border:2px solid var(--verde);
}
.qr p{margin:0; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; color:var(--verde)}
.qr a{color:var(--verde); text-decoration:none; font-size:.78rem; letter-spacing:.01em; text-transform:none; font-weight:400}
.qr a:hover{text-decoration:underline}

/* ---------- Sezione saluti ---------- */
.saluti{
  text-align:center;
  padding:70px 20px 60px;
}
.saluti h2{
  font-family:var(--display);
  font-size:clamp(2.4rem,8vw,4.2rem);
  color:var(--verde);
  margin:0 0 16px;
  letter-spacing:.02em;
}
.saluti p{
  font-size:clamp(1.2rem,3.2vw,2rem);
  color:var(--inchiostro);
  margin:0;
}
@media print{
  .saluti{padding:24mm 0 18mm}
  .saluti h2{color:#000}
  .saluti p{color:#000}
}

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;color:#000;font-size:10.5pt;line-height:1.3}
    .banchi,.chiusura{display:none}
    .qr{margin:4mm auto 0; padding:0; break-inside:avoid; page-break-inside:avoid}
    .qr svg{width:74px; height:74px; border:1pt solid #000; padding:4px}
    .qr p{color:#000; font-size:7.5pt}
    .qr a{color:#000; font-size:7.5pt}
    body.stampa-colore .qr svg{border-color:var(--verde)}
    body.stampa-colore .qr p, body.stampa-colore .qr a{color:var(--verde)}

    .wrap{max-width:none;padding:0}
    .testata{
      background:#fff;color:#000;padding:0 0 5mm;border-bottom:2pt solid #000;
    }
    .testata::after{display:none}
    .occhiello{color:#000;margin-bottom:4pt}
    .titolo .riga1{font-size:12pt}
    .titolo .riga2{font-size:24pt;color:#000}
    .titolo .anno{font-size:11pt;color:#000}
    .sottotitolo{color:#000;margin-top:5pt}
    /* spaziature compattate: servono a far stare il QR in prima pagina */
    .sezione{margin:5mm 0 0;break-inside:avoid}
    .insegna{
      background:#fff;color:#000;padding:0 0 3pt;
      border-bottom:1.5pt solid #000;border-radius:0;
    }
    .insegna::before{display:none}
    .insegna h2{font-size:14pt}
    .insegna p{color:#000}
    .voce{padding:4pt 0;border-bottom:.5pt solid #bbb;break-inside:avoid}
    .nome em{color:#333;font-size:9pt}
    .prezzo{font-size:11pt}
    .formato small{color:#333}
    /* i fritti stanno in coda alla cucina: due colonne solo dove serve */
    .voci{columns:2;column-gap:10mm}
    .voce{break-inside:avoid}
    #bevande .voci{columns:2}

    /* ===== STAMPA A COLORI: attiva con il pulsante, ripristina la grafica ===== */
    body.stampa-colore{
      background:var(--panna); color:var(--verde);
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    body.stampa-colore *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    body.stampa-colore .testata{
      background:var(--verde); color:var(--panna);
      padding:6mm 7mm 5mm; border-bottom:none;
    }
    body.stampa-colore .occhiello{color:var(--mais)}
    body.stampa-colore .titolo .riga2{color:var(--panna)}
    body.stampa-colore .titolo .anno{color:var(--mais)}
    body.stampa-colore .sottotitolo{color:var(--panna); opacity:.92}
    body.stampa-colore .insegna{
      background:var(--verde); color:var(--panna);
      padding:5pt 8pt; border-bottom:none; border-radius:4pt;
    }
    body.stampa-colore .insegna h2{color:var(--panna)}
    body.stampa-colore .insegna p{color:var(--mais)}
    body.stampa-colore .voce{border-bottom:.5pt dotted rgba(20,69,47,.45)}
    body.stampa-colore .nome{color:var(--verde)}
    body.stampa-colore .nome em{color:rgba(20,69,47,.75)}
    body.stampa-colore .prezzo{color:var(--rosso)}
    body.stampa-colore .formato small{color:rgba(20,69,47,.7)}
    body.stampa-colore .punti{border-bottom:.5pt dotted rgba(20,69,47,.4)}
    /* la testata a colori ha un riquadro pieno: serve un po' di respiro in meno */
    body.stampa-colore .insegna{padding:3.5pt 8pt}

    /* ===== solo bianco e nero: senza riquadri pieni avanza spazio, quindi
       qui le spaziature sono piu' larghe di quelle della versione a colori ===== */
    body:not(.stampa-colore) .testata{padding-bottom:5mm}
    body:not(.stampa-colore) .sezione{margin-top:5.5mm}
    body:not(.stampa-colore) .voce{padding:4.5pt 0}
    body:not(.stampa-colore) .insegna{padding-bottom:3pt}
    body:not(.stampa-colore) .qr{margin-top:4mm}
    body:not(.stampa-colore) .qr svg{width:74px; height:74px}
  }
</style>
</head>
<body>

<header class="testata">
  <div class="wrap">
    <p class="occhiello">Parrocchia di Sant'Agostino · Ferrara</p>
    <h1 class="titolo"><span class="riga1">Festa di</span><span class="riga2">Sant'Agostino</span><span class="anno">2026</span></h1>
    <p class="sottotitolo">Grazie a tutti per aver partecipato!<br>Ci vediamo l'anno prossimo.</p>
  </div>
</header>

<main class="wrap">

  <section class="saluti">
    <h2>La festa è finita!</h2>
    <p>Arrivederci all'anno prossimo.</p>
  </section>

</main>





</body>
</html>
