<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festa di Sant'Agostino 2026 · Grazie!</title>
<meta name="description" content="La Festa di Sant'Agostino 2026 è finita. Arrivederci all'anno prossimo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#14452F;
    --verde-scuro:#0E3222;
    --panna:#FBF6EA;
    --rosso:#B5232B;
    --mais:#E8B33C;
    --inchiostro:#1A211D;
    --display:"Archivo Black",system-ui,sans-serif;
    --testo:"Archivo",system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

  body{
    margin:0;
    background:var(--panna);
    color:var(--inchiostro);
    font-family:var(--testo);
    font-size:17px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
  }

  .wrap{max-width:940px;margin:0 auto;padding:0 20px}

  /* ---------- Testata ---------- */
  .testata{
    background:var(--verde);
    color:var(--panna);
    padding:38px 0 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .testata::after{
    content:"";
    position:absolute;left:0;right:0;bottom:0;height:6px;
    background:repeating-linear-gradient(90deg,var(--mais) 0 14px,var(--rosso) 14px 28px);
  }
  .occhiello{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mais);margin:0 0 12px;font-weight:600;
  }
  .titolo{
    font-family:var(--display);
    margin:0;
    line-height:1.02;
    text-transform:none;
    font-variant-caps:small-caps;
    letter-spacing:.005em;
    overflow-wrap:break-word;
  }
  .titolo span{display:block}
  .titolo .riga1{
    font-size:clamp(1.15rem,4.4vw,1.7rem);
    letter-spacing:.06em;
  }
  .titolo .riga2{
    font-size:clamp(1.85rem,8vw,3.2rem);
    color:var(--mais);
    line-height:1;
  }
  .titolo .anno{
    font-size:clamp(1rem,3.6vw,1.45rem);
    letter-spacing:.14em;
    margin-top:6px;
    color:rgba(251,246,234,.85);
  }
  .sottotitolo{
    margin:14px auto 0;max-width:34ch;
    font-size:15px;color:rgba(251,246,234,.8);
  }

  /* ---------- Sezione saluti ---------- */
  .saluti{
    text-align:center;
    padding:70px 20px 60px;
  }
  .saluti h2{
    font-family:var(--display);
    font-size:clamp(2.4rem,8vw,4.2rem);
    color:var(--verde);
    margin:0 0 16px;
    letter-spacing:.02em;
  }
  .saluti p{
    font-size:clamp(1.2rem,3.2vw,2rem);
    color:var(--inchiostro);
    margin:0;
  }

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;color:#000;font-size:10.5pt}
    .testata{background:#fff;color:#000;padding:0 0 8mm;border-bottom:2pt solid #000}
    .testata::after{display:none}
    .occhiello{color:#000}
    .titolo .riga2{color:#000}
    .titolo .anno{color:#000}
    .sottotitolo{color:#000}
    .saluti h2{color:#000}
    .saluti p{color:#000}
    .wrap{max-width:none;padding:0}
  }
</style>
</head>
<body>

<header class="testata">
  <div class="wrap">
    <p class="occhiello">Parrocchia di Sant'Agostino · Ferrara</p>
    <h1 class="titolo"><span class="riga1">Festa di</span><span class="riga2">Sant'Agostino</span><span class="anno">2026</span></h1>
    <p class="sottotitolo">Grazie a tutti per aver partecipato!<br>Ci vediamo l'anno prossimo.</p>
  </div>
</header>

<main class="wrap">
  <section class="saluti">
    <h2>La festa è finita!</h2>
    <p>Arrivederci all'anno prossimo.</p>
  </section>
</main>

</body>
</html>
